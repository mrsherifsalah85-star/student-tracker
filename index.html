<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة الطلاب</title>
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d2330;--mu:#6b7280;--ac:#1f5eff;--ok:#1a8f5a;--bad:#d33a3a;--wa:#c27c00;--bd:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--cd:#1e222b;--tx:#eceef2;--mu:#99a1b0;--ac:#6d93ff;--ok:#3fc78b;--bad:#ff7070;--wa:#f0b040;--bd:#2f3440}}
:root[data-theme="dark"]{--bg:#14171d;--cd:#1e222b;--tx:#eceef2;--mu:#99a1b0;--ac:#6d93ff;--ok:#3fc78b;--bad:#ff7070;--wa:#f0b040;--bd:#2f3440}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
#app{max-width:720px;margin:auto;padding:10px 12px 40px}
nav{display:flex;gap:6px;margin-bottom:10px}nav button{flex:1}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;box-sizing:border-box}
button{cursor:pointer}button.on,.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.pri{width:100%;padding:12px;font-weight:700;margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{white-space:nowrap}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:13px;color:var(--mu)}label input,label select{width:100%;color:var(--tx)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row input{width:80px;text-align:center}.nm{unicode-bidi:plaintext;text-align:start}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:start}tr.c{cursor:pointer}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
h2{margin:4px 0 8px;font-size:18px}h3{margin:0 0 8px;font-size:15px}textarea{width:100%;min-height:90px}
@media print{nav,.np,.chips{display:none}body{background:#fff}.card{break-inside:avoid}}
</style></head><body><div id="app"></div>
<script>
const D={"Class 1":[]};
let S=null;try{S=JSON.parse(localStorage.getItem('st1'))}catch(e){}
if(!S||!S.classes)S={classes:D,recs:[]};
const save=()=>{try{localStorage.setItem('st1',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fn=n=>n;
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f0=x=>x==null?'–':Math.round(x)+'%';
const col=p=>p==null?'':p>=75?'ok':p>=60?'wa':'bad';
const keys=()=>Object.keys(S.classes);
let v={p:'cls',c:keys()[0],s:0,e:null,log:[]},vr=null;
const pct=(r,n)=>r.scores[n]==null?null:r.scores[n]/r.max*100;
const recs=c=>S.recs.filter(r=>r.cls==c).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
function info(c,n){const ser=[];recs(c).forEach(r=>{const p=pct(r,n);if(p!=null)ser.push({r,p,ca:mean(S.classes[c].map(m=>pct(r,m)).filter(x=>x!=null))})});
const ps=ser.map(s=>s.p),k=ps.length,avg=mean(ps);let tr=0;
if(k>=4)tr=mean(ps.slice(-2))-mean(ps.slice(-4,-2));else if(k>=2)tr=ps[k-1]-ps[k-2];
const fl=[];if(avg!=null&&avg<60)fl.push('المستوى العام أقل من 60%');
if(k>=2&&ps[k-1]-ps[k-2]<=-20)fl.push('دروب كبير في آخر تقييم');
if(k>=3&&ps[k-1]<ps[k-2]&&ps[k-2]<ps[k-3])fl.push('نزول في تقييمين ورا بعض');
return{ser,avg,tr,fl,k,last:k?ps[k-1]:null}}
const go=(p,s)=>{v.p=p;if(s!=null)v.s=s;render();scrollTo(0,0)};
const sc=i=>{v.c=keys()[i];if(v.e){v.e.vals={};v.log=[]}render()};
const chips=()=>`<div class="chips np">${keys().map((k,i)=>`<button class="${k==v.c?'on':''}" onclick="sc(${i})">${esc(k)}</button>`).join('')}</div>`;
const nav=()=>`<nav class="np">${[['cls','الفصل'],['entry','إدخال درجات'],['set','إعدادات']].map(([p,t])=>`<button class="${v.p==p||(v.p=='stu'&&p=='cls')?'on':''}" onclick="go('${p}')">${t}</button>`).join('')}</nav>`;
const tl=r=>(r.type=='quiz'?'Quiz':'Assessment')+(r.topic?' · '+esc(r.topic):'');
function cls(){const c=v.c,L=S.classes[c].map((n,i)=>({n,i,...info(c,n)})),R=recs(c);
const ar=t=>t>5?'<span class="ok">▲</span>':t<-5?'<span class="bad">▼</span>':'<span class="mu">■</span>';
return chips()+`<div class="card"><h2>${esc(c)} · ${L.length} طالب</h2><table><tr class="mu"><th>الطالب</th><th>المتوسط</th><th>آخر</th><th></th></tr>${L.map(x=>`<tr class="c" onclick="go('stu',${x.i})"><td class="nm">${x.fl.length?'⚠️ ':''}${esc(fn(x.n))}</td><td class="${col(x.avg)}">${f0(x.avg)}</td><td>${f0(x.last)}</td><td>${x.k>1?ar(x.tr):''}</td></tr>`).join('')}</table><p class="mu">⚠️ = محتاج متابعة (متوسط أقل من 60% أو دروب).</p></div>
<div class="card"><h3>التقييمات المسجلة</h3>${R.length?R.map(r=>`<div class="row"><span>${r.date} · ${tl(r)}<br><span class="mu">متوسط الفصل ${f0(mean(S.classes[c].map(n=>pct(r,n)).filter(x=>x!=null)))} (من ${r.max})</span></span><button class="np" onclick="del(${r.id})">حذف</button></div>`).join(''):'<p class="mu">لسه مفيش درجات. اضغط «إدخال درجات».</p>'}
${R.length?'<button class="np" style="margin-top:8px" onclick="cp()">نسخ الجدول للصقه في إكسل</button>':''}</div>`}
function del(id){if(confirm('تحذف التقييم ده؟')){S.recs=S.recs.filter(r=>r.id!=id);save();render()}}
function cp(){const c=v.c,R=recs(c);const t=['الاسم\t'+R.map(r=>r.date+' '+(r.type=='quiz'?'Quiz':'Assess')+' '+(r.topic||'')+' /'+r.max).join('\t')].concat(S.classes[c].map(n=>n+'\t'+R.map(r=>r.scores[n]??'').join('\t'))).join('\n');
navigator.clipboard.writeText(t).then(()=>alert('تم النسخ'),()=>alert('النسخ مش متاح'))}
function chart(ser){const W=320,H=160,P=26,n=ser.length,x=i=>P+(n<2?(W-2*P)/2:i*(W-2*P)/(n-1)),y=p=>H-P-p*(H-2*P)/100;
const ln=a=>a.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p).toFixed(1)).join('');
return `<svg viewBox="0 0 ${W} ${H}" width="100%" dir="ltr">${[0,50,100].map(g=>`<line x1="${P}" x2="${W-P}" y1="${y(g)}" y2="${y(g)}" stroke="var(--bd)"/><text x="2" y="${y(g)+4}" font-size="10" fill="var(--mu)">${g}</text>`).join('')}<path d="${ln(ser.map(s=>s.ca))}" fill="none" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="4 3"/><path d="${ln(ser.map(s=>s.p))}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>${ser.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.p)}" r="3.5" fill="var(--ac)"/><text x="${x(i)}" y="${y(s.p)-8}" font-size="10" text-anchor="middle" fill="var(--tx)">${Math.round(s.p)}</text>`).join('')}</svg>`}
function stu(){const c=v.c,n=S.classes[c][v.s],x=info(c,n),q=x.ser.filter(s=>s.r.type=='quiz'),a=x.ser.filter(s=>s.r.type!='quiz'),T={};
x.ser.forEach(s=>{const t=(s.r.topic||'').trim();if(t)(T[t]=T[t]||[]).push(s.p)});
const tp=Object.entries(T).map(([t,a])=>[t,mean(a)]).sort((p,q)=>p[1]-q[1]),weak=tp.filter(t=>t[1]<60);
const tr=x.k<2?'':x.tr>5?'مستواه في تحسن':x.tr<-5?'مستواه في نزول':'مستواه ثابت تقريبًا';
const ca=mean(x.ser.map(s=>s.ca));
return `<div class="np"><button onclick="go('cls')">← رجوع</button></div><div class="card"><h2 class="nm">${esc(n)}</h2><div class="mu">${esc(c)} · Year 4 · Maths</div>${x.k?`<p>المتوسط العام <b class="${col(x.avg)}">${f0(x.avg)}</b>${ca!=null?` (متوسط الفصل ${f0(ca)})`:''} في ${x.k} تقييم. ${tr}.</p><div class="g"><div>Quizzes: <b>${f0(mean(q.map(s=>s.p)))}</b></div><div>Assessments: <b>${f0(mean(a.map(s=>s.p)))}</b></div></div>`:'<p class="mu">مفيش درجات لسه.</p>'}</div>
${x.k?`<div class="card"><h3>المستوى عبر الوقت <span class="mu">(الأزرق = الطالب، المتقطع = متوسط الفصل)</span></h3>${chart(x.ser)}</div>`:''}
${x.fl.length?`<div class="card bad"><h3>⚠️ تنبيهات</h3>${x.fl.map(f=>'• '+f).join('<br>')}</div>`:''}
${tp.length?`<div class="card"><h3>حسب الموضوع</h3>${tp.map(([t,p])=>`<div style="margin-bottom:8px"><div class="row" style="border:0;padding:0"><span>${esc(t)}</span><b class="${col(p)}">${f0(p)}</b></div><div class="bar"><i style="width:${p}%;background:var(--${p>=75?'ok':p>=60?'wa':'bad'})"></i></div></div>`).join('')}${weak.length?`<p class="bad">محتاج دعم في: ${weak.map(w=>esc(w[0])).join('، ')}</p>`:''}</div>`:x.k?'<p class="mu">سجّل الموضوع مع كل تقييم علشان تظهر نقاط الضعف.</p>':''}
<div class="card"><h3>كل الدرجات</h3>${x.ser.slice().reverse().map(s=>`<div class="row"><span>${s.r.date} · ${tl(s.r)}</span><b class="${col(s.p)}">${s.r.scores[n]}/${s.r.max}</b></div>`).join('')}</div><button class="pri np" onclick="print()">طباعة / PDF لولي الأمر</button>`}
const W={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,صفر:0,واحد:1,اتنين:2,اثنين:2,تلاتة:3,ثلاثة:3,اربعة:4,أربعة:4,خمسة:5,ستة:6,سبعة:7,تمانية:8,ثمانية:8,تسعة:9,عشرة:10};
function hear(t){const e=v.e;let s=t.toLowerCase().replace(/[,،]/g,' ').split(/\s+/).map(w=>w in W?W[w]:w).join(' ').replace(/(\d)\s*(and a half|ونص|و نص)/g,'$1.5'),nm=[],o=[];
for(const w of s.split(/\s+/)){if(/^\d+(\.\d+)?$/.test(w)){if(nm.length)o.push([nm.join(' '),+w]);nm=[]}else nm.push(w)}
o.forEach(([q,g])=>{const qt=q.split(' ');let m=S.classes[v.c].filter(n=>{const l=n.toLowerCase();return l.startsWith(qt[0])&&qt.every(z=>l.includes(z))});
if(m.length==1&&g<=e.max){e.vals[m[0]]=g;v.log.unshift('✅ '+m[0]+' ← '+g)}else v.log.unshift(m.length>1?'❓ '+m.length+' طلاب بنفس الاسم «'+q+'»، قول الاسم الأول والتاني ('+g+' ماتسجلتش)':'❓ مش متأكد: '+q+' '+g)});render()}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('المتصفح مش بيدعم الصوت. استخدم القايمة (أو افتح من Chrome).');
if(vr){vr.stop();vr=null;return render()}
vr=new R();vr.lang=document.getElementById('vl').value;vr.continuous=true;vr.onresult=ev=>hear(ev.results[ev.results.length-1][0].transcript);vr.onend=()=>{vr=null;render()};vr.start();render()}
function nx(ev){if(ev.key=='Enter'){ev.preventDefault();const i=[...document.querySelectorAll('[data-n]')];(i[i.indexOf(ev.target)+1]||ev.target).focus()}}
function entry(){const c=v.c,e=v.e||(v.e={type:'quiz',date:new Date().toISOString().slice(0,10),topic:'',max:10,vals:{}});
const tps=[...new Set(S.recs.map(r=>r.topic).filter(Boolean))];
return chips()+`<div class="card np"><div class="g"><label>النوع<select onchange="v.e.type=this.value;v.e.max=this.value=='quiz'?10:30;render()"><option value="quiz" ${e.type=='quiz'?'selected':''}>Weekly Quiz</option><option value="ass" ${e.type!='quiz'?'selected':''}>Monthly Assessment</option></select></label>
<label>التاريخ<input type="date" value="${e.date}" onchange="v.e.date=this.value"></label>
<label>الموضوع<input list="tp" value="${esc(e.topic)}" placeholder="مثلاً Shapes" oninput="v.e.topic=this.value"></label>
<label>الدرجة الكاملة<input type="number" value="${e.max}" onchange="v.e.max=+this.value"></label></div><datalist id="tp">${tps.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
<div class="g" style="margin-top:10px"><select id="vl"><option value="en-US">صوت: أسماء إنجليزي</option><option value="ar-EG">صوت: عربي</option></select><button onclick="mic()" class="${vr?'on':''}">${vr?'⏹ إيقاف':'🎤 سجّل بالصوت'}</button></div>
<p class="mu">قول مثلًا: «Adham nine، Ayla seven and a half». لو فيه أكتر من طالب بنفس الاسم الأول قول الاسم الأول والتاني (Omar Ahmed nine)، ومش هيسجل لو الاسم مش واضح.</p><label>أو اكتب/املى بميكروفون الكيبورد<textarea id="dt" style="min-height:60px" placeholder="Adham 9, Ayla 7.5, Omar Ahmed 8"></textarea></label><button onclick="hear(dt.value)" style="margin-top:6px;width:100%">وزّع الدرجات على الأسماء</button>${v.log.length?`<div class="mu">${v.log.slice(0,6).join('<br>')}</div>`:''}</div>
<div class="card">${S.classes[c].map((n,i)=>`<div class="row"><span class="nm">${esc(fn(n))}</span><input inputmode="decimal" data-n="1" value="${e.vals[n]??''}" oninput="v.e.vals[S.classes[v.c][${i}]]=this.value" onkeydown="nx(event)"></div>`).join('')}</div><button class="pri np" onclick="sv()">حفظ الدرجات</button>`}
function sv(){const e=v.e,c=v.c,sc={};let bad=0;
S.classes[c].forEach(n=>{const x=e.vals[n];if(x==null||String(x).trim()==='')return;const g=parseFloat(String(x).replace(',','.'));if(isNaN(g)||g<0||g>e.max)bad++;else sc[n]=g});
if(bad)return alert('فيه '+bad+' درجة غلط (أكبر من الدرجة الكاملة أو مش رقم)');
if(!Object.keys(sc).length)return alert('مفيش درجات تتحفظ');
S.recs.push({id:Date.now(),cls:c,type:e.type,date:e.date,topic:e.topic.trim(),max:e.max,scores:sc});save();v.e=null;v.log=[];go('cls')}
function set(){return `<div class="card"><h3>إضافة فصل</h3><label>اسم الفصل<input id="cn" placeholder="Year 3 A"></label><label style="margin-top:8px">الأسماء (اسم في كل سطر، الصقها من الإكسل)<textarea id="cl"></textarea></label><button class="pri" onclick="addc()">إضافة</button></div>
<div class="card"><h3>نسخة احتياطية</h3><p class="mu">البيانات محفوظة في متصفح الموبايل ده. انسخ نسخة احتياطية واحتفظ بيها (واتساب لنفسك مثلًا).</p><button onclick="navigator.clipboard.writeText(JSON.stringify(S)).then(()=>alert('تم النسخ'),()=>alert('النسخ مش متاح'))">نسخ النسخة الاحتياطية</button><label style="margin-top:8px">استرجاع (الصق النسخة هنا)<textarea id="rs"></textarea></label><button onclick="rst()" style="margin-top:6px">استرجاع</button></div>`}
function addc(){const n=cn.value.trim(),L=cl.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!n||!L.length)return alert('اكتب اسم الفصل والأسماء');if(S.classes['Class 1']&&!S.classes['Class 1'].length)delete S.classes['Class 1'];S.classes[n]=L;save();v.c=n;v.e=null;go('cls')}
function rst(){try{const d=JSON.parse(rs.value);if(!d.classes||!d.recs)throw 0;if(!confirm('ده هيستبدل البيانات الحالية. متأكد؟'))return;S=d;save();v.c=keys()[0];v.e=null;go('cls')}catch(x){alert('النسخة مش صالحة')}}
function render(){document.getElementById('app').innerHTML=nav()+({cls,entry,stu,set}[v.p])()}
render();
</script></body></html>
